name: CI

on:
  push:
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - name: Install X11 smoke-test dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb x11-apps x11-utils sway
      - run: cargo fmt --check
      - run: cargo test
      - run: cargo clippy --all-targets -- -D warnings
      - name: Xvfb integration tests
        run: |
          cargo test runtime::native::tests:: -- --ignored
      - name: Wayland compositor integration tests
        run: |
          cargo test runtime::wayland::tests:: -- --ignored --skip reports_sway_exit_instead_of_timing_out_on_a_long_runtime_dir_path
      - name: Wayland compositor long-runtime-dir regression test
        run: |
          long_dir="/tmp/$(printf 'x%.0s' {1..80})"
          mkdir -p "$long_dir"
          TMPDIR="$long_dir" cargo test --lib runtime::wayland::tests::reports_sway_exit_instead_of_timing_out_on_a_long_runtime_dir_path -- --ignored --exact

  macos:
    strategy:
      matrix:
        runner: [macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - run: cargo fmt --check
      - run: cargo test --all-targets
      - run: cargo clippy --all-targets -- -D warnings
